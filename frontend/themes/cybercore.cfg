# Cybercore
#
# Neon on near-black with every corner squared off. The rest of the look --
# clipped corners, corner brackets, the grid behind everything, scanlines --
# is drawn by the widgets while mse_ui_cyber is on; this file is only the
# palette and the metrics, so it also works as an ordinary theme without it.
#
#     exec themes/cybercore.cfg

# Surfaces, furthest back first: black with a little blue in it
set mse_theme_bg_base          "0.0235 0.0275 0.0431 1"
set mse_theme_bg_sunken        "0.0118 0.0157 0.0275 1"
set mse_theme_bg_raised        "0.0431 0.0588 0.0863 1"
set mse_theme_bg_overlay       "0.0627 0.0824 0.1216 1"
set mse_theme_bg_hover         "0.0588 0.1176 0.149 1"
set mse_theme_bg_active        "0.0745 0.1882 0.2275 1"

# Hairlines, tinted toward the accent so a border reads as part of the glow
set mse_theme_border           "0.0745 0.2275 0.2706 1"
set mse_theme_border_strong    "0.1176 0.3804 0.4392 1"

# Type
set mse_theme_text             "0.851 0.9843 1 1"
set mse_theme_text_muted       "0.4353 0.6588 0.702 1"
set mse_theme_text_faint       "0.2902 0.4706 0.5137 1"
set mse_theme_text_on_accent   "0.0078 0.0157 0.0235 1"

# The accent: electric cyan
set mse_theme_accent           "0 0.9412 1 1"
set mse_theme_accent_hover     "0.4196 0.9686 1 1"
set mse_theme_accent_active    "0 0.7216 0.7686 1"
set mse_theme_accent_soft      "0 0.9412 1 0.14"
set mse_theme_accent_glow      "0 0.9412 1 0.08"

# Status: acid green, warning yellow, hot pink, magenta
set mse_theme_success          "0.2235 1 0.0784 1"
set mse_theme_warning          "0.9882 0.9333 0.0392 1"
set mse_theme_danger           "1 0.1647 0.4275 1"
set mse_theme_info             "1 0.1686 0.8392 1"

set mse_theme_is_light 0

# No rounding anywhere: the corners are cut, not curved
set mse_style_window_rounding    0
set mse_style_child_rounding     0
set mse_style_frame_rounding     0
set mse_style_popup_rounding     0
set mse_style_scrollbar_rounding 0
set mse_style_grab_rounding      0
set mse_style_tab_rounding       0
set mse_style_rounding_sm        0
set mse_style_rounding_md        0
set mse_style_rounding_lg        0
