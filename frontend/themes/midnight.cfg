# Midnight
#
# A theme is a list of cvar assignments and nothing else, so it can be
# edited, copied or written by hand. Apply it with:
#
#     exec themes/midnight.cfg
#
# Anything not set here keeps whatever the last theme left, which is what
# makes a file that sets only an accent a valid theme.

# Surfaces, furthest back first
set mse_theme_bg_base          "0.0392 0.0392 0.0549 1"
set mse_theme_bg_sunken        "0.0235 0.0235 0.0353 1"
set mse_theme_bg_raised        "0.0667 0.0667 0.0902 1"
set mse_theme_bg_overlay       "0.0902 0.0902 0.1216 1"
set mse_theme_bg_hover         "0.1098 0.1098 0.1451 1"
set mse_theme_bg_active        "0.1451 0.1451 0.1882 1"

# Hairlines
set mse_theme_border           "0.1333 0.1333 0.1725 1"
set mse_theme_border_strong    "0.2039 0.2039 0.2588 1"

# Type
set mse_theme_text             "0.9176 0.9176 0.949 1"
set mse_theme_text_muted       "0.6039 0.6039 0.6745 1"
set mse_theme_text_faint       "0.3608 0.3608 0.4196 1"
set mse_theme_text_on_accent   "0.0431 0.0235 0.0863 1"

# The accent: selection, focus, the one primary action
set mse_theme_accent           "0.6392 0.4431 0.9686 1"
set mse_theme_accent_hover     "0.7216 0.5529 1 1"
set mse_theme_accent_active    "0.5412 0.3333 0.8784 1"
set mse_theme_accent_soft      "0.6392 0.4431 0.9686 0.18"
set mse_theme_accent_glow      "0.6392 0.4431 0.9686 0.07"

# Status
set mse_theme_success          "0.2471 0.7255 0.3137 1"
set mse_theme_warning          "0.8235 0.6 0.1333 1"
set mse_theme_danger           "0.9725 0.3176 0.2863 1"
set mse_theme_info             "0.3451 0.651 1 1"

# Light palettes dim differently: a wash that reads on a dark surface
# is invisible on a pale one.
set mse_theme_is_light 0
