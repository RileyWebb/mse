# Moss
#
# A theme is a list of cvar assignments and nothing else, so it can be
# edited, copied or written by hand. Apply it with:
#
#     exec themes/moss.cfg
#
# Anything not set here keeps whatever the last theme left, which is what
# makes a file that sets only an accent a valid theme.

# Surfaces, furthest back first
set mse_theme_bg_base          "0.0275 0.0471 0.0353 1"
set mse_theme_bg_sunken        "0.0157 0.0275 0.0196 1"
set mse_theme_bg_raised        "0.0627 0.0941 0.0706 1"
set mse_theme_bg_overlay       "0.0863 0.1255 0.102 1"
set mse_theme_bg_hover         "0.1137 0.1686 0.1294 1"
set mse_theme_bg_active        "0.149 0.2118 0.1608 1"

# Hairlines
set mse_theme_border           "0.1216 0.1765 0.1412 1"
set mse_theme_border_strong    "0.1843 0.2588 0.2078 1"

# Type
set mse_theme_text             "0.902 0.949 0.9137 1"
set mse_theme_text_muted       "0.5647 0.6745 0.6 1"
set mse_theme_text_faint       "0.3373 0.4235 0.3647 1"
set mse_theme_text_on_accent   "0.0118 0.0863 0.0392 1"

# The accent: selection, focus, the one primary action
set mse_theme_accent           "0.2902 0.8706 0.502 1"
set mse_theme_accent_hover     "0.4392 0.9137 0.6314 1"
set mse_theme_accent_active    "0.2 0.7255 0.4 1"
set mse_theme_accent_soft      "0.2902 0.8706 0.502 0.16"
set mse_theme_accent_glow      "0.2902 0.8706 0.502 0.06"

# Status
set mse_theme_success          "0.2902 0.8706 0.502 1"
set mse_theme_warning          "0.9804 0.8 0.0824 1"
set mse_theme_danger           "0.9725 0.4431 0.4431 1"
set mse_theme_info             "0.2196 0.7412 0.9725 1"

# Light palettes dim differently: a wash that reads on a dark surface
# is invisible on a pale one.
set mse_theme_is_light 0
