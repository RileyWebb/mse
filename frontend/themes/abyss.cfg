# Abyss
#
# A theme is a list of cvar assignments and nothing else, so it can be
# edited, copied or written by hand. Apply it with:
#
#     exec themes/abyss.cfg
#
# Anything not set here keeps whatever the last theme left, which is what
# makes a file that sets only an accent a valid theme.

# Surfaces, furthest back first
set mse_theme_bg_base          "0.0235 0.0392 0.0706 1"
set mse_theme_bg_sunken        "0.0118 0.0235 0.0471 1"
set mse_theme_bg_raised        "0.051 0.0784 0.1255 1"
set mse_theme_bg_overlay       "0.0706 0.1059 0.1647 1"
set mse_theme_bg_hover         "0.0941 0.1412 0.2118 1"
set mse_theme_bg_active        "0.1255 0.1804 0.2667 1"

# Hairlines
set mse_theme_border           "0.1059 0.1569 0.2235 1"
set mse_theme_border_strong    "0.1686 0.2353 0.3255 1"

# Type
set mse_theme_text             "0.8863 0.9255 0.9725 1"
set mse_theme_text_muted       "0.549 0.6353 0.7373 1"
set mse_theme_text_faint       "0.3216 0.3961 0.4902 1"
set mse_theme_text_on_accent   "0.0118 0.0784 0.1098 1"

# The accent: selection, focus, the one primary action
set mse_theme_accent           "0.298 0.7882 0.9412 1"
set mse_theme_accent_hover     "0.4549 0.8588 0.9843 1"
set mse_theme_accent_active    "0.2 0.651 0.7961 1"
set mse_theme_accent_soft      "0.298 0.7882 0.9412 0.18"
set mse_theme_accent_glow      "0.298 0.7882 0.9412 0.07"

# Status
set mse_theme_success          "0.2902 0.8706 0.502 1"
set mse_theme_warning          "0.9843 0.749 0.1412 1"
set mse_theme_danger           "0.9843 0.4431 0.5216 1"
set mse_theme_info             "0.3765 0.6471 0.9804 1"

# Light palettes dim differently: a wash that reads on a dark surface
# is invisible on a pale one.
set mse_theme_is_light 0
