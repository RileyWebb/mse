# Paper
#
# A theme is a list of cvar assignments and nothing else, so it can be
# edited, copied or written by hand. Apply it with:
#
#     exec themes/paper.cfg
#
# Anything not set here keeps whatever the last theme left, which is what
# makes a file that sets only an accent a valid theme.

# Surfaces, furthest back first
set mse_theme_bg_base          "0.9647 0.9647 0.9804 1"
set mse_theme_bg_sunken        "0.9255 0.9255 0.9529 1"
set mse_theme_bg_raised        "1 1 1 1"
set mse_theme_bg_overlay       "1 1 1 1"
set mse_theme_bg_hover         "0.9333 0.9333 0.9647 1"
set mse_theme_bg_active        "0.8863 0.8863 0.9333 1"

# Hairlines
set mse_theme_border           "0.8706 0.8706 0.9098 1"
set mse_theme_border_strong    "0.7608 0.7608 0.8235 1"

# Type
set mse_theme_text             "0.0824 0.0824 0.1137 1"
set mse_theme_text_muted       "0.3569 0.3569 0.4314 1"
set mse_theme_text_faint       "0.5922 0.5922 0.6667 1"
set mse_theme_text_on_accent   "1 1 1 1"

# The accent: selection, focus, the one primary action
set mse_theme_accent           "0.4863 0.2275 0.9294 1"
set mse_theme_accent_hover     "0.5451 0.3608 0.9647 1"
set mse_theme_accent_active    "0.4275 0.1569 0.851 1"
set mse_theme_accent_soft      "0.4863 0.2275 0.9294 0.13"
set mse_theme_accent_glow      "0.4863 0.2275 0.9294 0.05"

# Status
set mse_theme_success          "0.0824 0.502 0.2392 1"
set mse_theme_warning          "0.7059 0.3255 0.0353 1"
set mse_theme_danger           "0.7529 0.149 0.149 1"
set mse_theme_info             "0.1137 0.3059 0.8471 1"

# Light palettes dim differently: a wash that reads on a dark surface
# is invisible on a pale one.
set mse_theme_is_light 1
