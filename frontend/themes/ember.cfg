# Ember
#
# A theme is a list of cvar assignments and nothing else, so it can be
# edited, copied or written by hand. Apply it with:
#
#     exec themes/ember.cfg
#
# Anything not set here keeps whatever the last theme left, which is what
# makes a file that sets only an accent a valid theme.

# Surfaces, furthest back first
set mse_theme_bg_base          "0.0588 0.0471 0.0392 1"
set mse_theme_bg_sunken        "0.0353 0.0275 0.0235 1"
set mse_theme_bg_raised        "0.0941 0.0745 0.0627 1"
set mse_theme_bg_overlay       "0.1216 0.098 0.0824 1"
set mse_theme_bg_hover         "0.1529 0.1255 0.102 1"
set mse_theme_bg_active        "0.1922 0.1529 0.1255 1"

# Hairlines
set mse_theme_border           "0.1686 0.1373 0.1098 1"
set mse_theme_border_strong    "0.2471 0.2 0.1608 1"

# Type
set mse_theme_text             "0.9647 0.9333 0.902 1"
set mse_theme_text_muted       "0.6863 0.6235 0.5686 1"
set mse_theme_text_faint       "0.4235 0.3725 0.3294 1"
set mse_theme_text_on_accent   "0.102 0.0588 0.0078 1"

# The accent: selection, focus, the one primary action
set mse_theme_accent           "0.9608 0.6196 0.0431 1"
set mse_theme_accent_hover     "0.9843 0.749 0.1412 1"
set mse_theme_accent_active    "0.851 0.4667 0.0235 1"
set mse_theme_accent_soft      "0.9608 0.6196 0.0431 0.18"
set mse_theme_accent_glow      "0.9608 0.6196 0.0431 0.07"

# Status
set mse_theme_success          "0.5176 0.8 0.0863 1"
set mse_theme_warning          "0.9608 0.6196 0.0431 1"
set mse_theme_danger           "0.9373 0.2667 0.2667 1"
set mse_theme_info             "0.2196 0.7412 0.9725 1"

# Light palettes dim differently: a wash that reads on a dark surface
# is invisible on a pale one.
set mse_theme_is_light 0
